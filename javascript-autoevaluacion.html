<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoevaluación de JavaScript - Curso Web</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
    }
    .pregunta-card {
      border-left: 4px solid #0d6efd;
    }
    .opcion-label {
      cursor: pointer;
    }
    code {
      color: #d63384;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <!-- Encabezado y navegación consistente con el curso -->
    <div class="d-flex flex-wrap justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-4 border gap-2">
      <div>
        <h3 class="mb-0 text-primary fw-bold">Autoevaluación: Módulo JavaScript</h3>
        <small class="text-muted">Pon a prueba lo aprendido en las 12 secciones del tutorial y revisa tu retroalimentación.</small>
      </div>
      <div class="d-flex gap-2">
        <a href="javascript-tutorial.html" class="btn btn-outline-primary btn-sm">Volver al Tutorial JS</a>
        <a href="menu.html" id="btn-inicio" class="btn btn-danger btn-sm">Menú Principal</a>
      </div>
    </div>

    <!-- Barra de progreso y resumen superior -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-bold small text-secondary">Progreso de Respuestas</span>
          <span class="badge bg-primary" id="contador-respondidas">0 / 10 respondidas</span>
        </div>
        <div class="progress" style="height: 10px;">
          <div class="progress-bar bg-success" id="barra-progreso" role="progressbar" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Formulario de Autoevaluación -->
    <form id="form-autoevaluacion">
      <div id="contenedor-preguntas" class="vstack gap-3"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center bg-white p-3 rounded shadow-sm mt-4 border gap-2">
        <button type="button" id="btn-reiniciar" class="btn btn-outline-secondary">
          Reiniciar Evaluación
        </button>
        <button type="submit" id="btn-calificar" class="btn btn-success px-4 fw-bold">
          Calificar Autoevaluación
        </button>
      </div>
    </form>

    <!-- Panel de Resultados y Retroalimentación -->
    <div id="panel-resultado" class="card shadow-sm mt-4 border-0" style="display: none;">
      <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
        <span>Resultado de la Autoevaluación</span>
        <span class="badge bg-info text-dark" id="badge-calificacion">0 / 10</span>
      </div>
      <div class="card-body" id="detalle-resultado"></div>
    </div>
  </div>

  <!-- jQuery y Bootstrap 5 JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica de la autoevaluación -->
  <script src="javascript-autoevaluacion.js"></script>
</body>
</html>
