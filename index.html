<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exsftw-Usuario</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .auth-card {
      max-width: 480px;
      width: 100%;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .nav-tabs .nav-link {
      color: #495057;
      font-weight: 500;
    }
    .nav-tabs .nav-link.active {
      font-weight: bold;
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="card auth-card bg-white p-4">
    <!-- Pestañas de Navegación -->
    <ul class="nav nav-tabs nav-fill mb-4" id="authTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Iniciar Sesión</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Registrar Usuario</button>
      </li>
    </ul>

    <!-- Mensajes de alerta -->
    <div id="alert-box" class="alert d-none" role="alert"></div>

    <div class="tab-content" id="authTabContent">
      
      <!-- FORMULARIO 1: INICIAR SESIÓN -->
      <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
        <h3 class="text-center mb-3 text-primary">EXEASOFTWARE</h3>
        <h4 class="text-center mb-3 text-primary">Acceso al Sistema</h4>
        <form id="form-login">
          <div class="mb-3">
            <label for="login-usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="login-usuario" required placeholder="Ej: supersusuario">
          </div>
          <div class="mb-3">
            <label for="login-clave" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="login-clave" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <!-- Panel de sesión activa -->
        <div id="session-active-info" class="d-none text-center mt-3">
          <div class="p-3 bg-light rounded border">
            <h5 class="text-success mb-2">¡Sesión Activa!</h5>
            <p class="mb-1">Bienvenido: <strong id="active-user-name"></strong></p>
            <a href="menu.html" id="btn-inicio" class="btn btn-danger btn-sm mt-2">Menú Principal</a>
            <button id="btn-logout" class="btn btn-danger btn-sm mt-2">Cerrar Sesión</button>
          </div>
        </div>
      </div>

      <!-- FORMULARIO 2: REGISTRO DE NUEVOS USUARIOS -->
      <div class="tab-pane fade" id="register-panel" role="tabpanel">
        <h4 class="text-center mb-3 text-success">Nuevo Registro</h4>
        <form id="form-registro">
          <div class="mb-3">
            <label for="reg-usuario" class="form-label">Usuario</label>
            <input type="email" class="form-control" id="reg-usuario" required placeholder="Utiliza tu correo ejmp: email@mail.com">
          </div>
          <div class="mb-3">
            <label for="reg-clave" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="reg-clave" required placeholder="Contraseña">
          </div>
          <div class="mb-3">
            <label for="reg-telefono" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="reg-telefono" required placeholder="Ej: 04148252604">
          </div>
          <div class="mb-3">
            <label for="reg-ippublica" class="form-label">IP Pública</label>
            <input type="text" class="form-control" id="reg-ippublica" required placeholder="Ej: 190.254.1.1">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="reg-activo" disabled>
            <label class="form-check-label" for="reg-activo">Usuario Activo</label>
          </div>
          <button type="submit" class="btn btn-success w-100">Guardar Parámetros</button>
        </form>
      </div>

    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="validar.js"></script>
</body>
</html>
