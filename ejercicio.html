<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor HTML en Vivo</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos Personalizados CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .editor-container {
      flex: 1;
      display: flex;
      padding: 15px;
      gap: 15px;
    }
    textarea {
      resize: none;
      font-family: monospace;
      font-size: 14px;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }
    textarea:focus {
      background-color: #1e1e1e;
      color: #d4d4d4;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background-color: #ffffff;
    }
    .card {
      height: 100%;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <p>Exeasoftware | Curso online</p>
      <span class="navbar-brand mb-0 h1"> Previsualizador de HTML en Tiempo Real</span>
      <button id="btn-inicio" class="btn btn-outline-light btn-sm">Menú Principal</a>
      <button id="btn-limpiar" class="btn btn-outline-light btn-sm">Limpiar Código</button>
    </div>
  </nav>

  <!-- Panel principal split screen -->
  <div class="container-fluid editor-container">
    <div class="row w-100 m-0">
      
      <!-- Lado Izquierdo: Editor -->
      <div class="col-md-6 p-1">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white font-weight-bold">
            Código HTML / CSS / JS
          </div>
          <div class="card-body">
            <textarea id="codigo-html" class="form-control h-100" placeholder="Escribe tu código HTML aquí..."><div style="text-align: center; margin-top: 50px;">
  <h1 style="color: #0d6efd;">¡Hola Mundo!</h1>
  <p>Escribe tu código a la izquierda y observa los cambios aquí.</p>
  <button onclick="alert('¡Funciona!')">Haz Clic</button>
</div></textarea>
          </div>
        </div>
      </div>

      <!-- Lado Derecho: Vista Previa -->
      <div class="col-md-6 p-1">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white font-weight-bold">
            Resultado / Vista Previa
          </div>
          <div class="card-body">
            <iframe id="vista-previa"></iframe>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica jQuery para renderizar el código -->
  <script>
    $(document).ready(function() {
      // Función para actualizar el iframe
      function actualizarVistaPrevia() {
        var codigo = $('#codigo-html').val();
        var iframe = $('#vista-previa')[0].contentWindow.document;
        
        iframe.open();
        iframe.write(codigo);
        iframe.close();
      }

      // Detectar cambios en tiempo real mientras el usuario escribe
      $('#codigo-html').on('input propertychange', function() {
        actualizarVistaPrevia();
      });
      // Regreso a menu principal
      $('#btn-inicio').click(function() {
        window.location.href = 'menu.html';
      });
      // Botón para limpiar el área de texto
      $('#btn-limpiar').click(function() {
        $('#codigo-html').val('');
        actualizarVistaPrevia();
      });

      // Renderizar el código inicial al cargar la página
      actualizarVistaPrevia();
    });
  </script>

</body>
</html>
